<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹 서버 프로그래밍 | 실습 포털</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #ff385c;
      --color-primary-active: #e00b41;
      --color-ink: #222222;
      --color-body: #484848;
      --color-muted: #717171;
      --color-canvas: #ffffff;
      --color-surface-soft: #f7f7f7;
      --color-hairline: #dddddd;
      --color-hairline-soft: #ebebeb;
      --radius-md: 16px;
      --radius-full: 9999px;
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
      --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Airbnb Cereal VF', 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--color-canvas);
      color: var(--color-ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 내비게이션 */
    .top-nav {
      border-bottom: 1px solid var(--color-hairline-soft);
      background: var(--color-canvas);
    }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--color-primary);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.2px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      fill: var(--color-primary);
    }

    .nav-link {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--color-muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-hairline);
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      color: var(--color-ink);
      border-color: var(--color-ink);
    }

    /* 메인 컨테이너 */
    .main-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 24px 80px;
      width: 100%;
      flex: 1;
    }

    .hero-section {
      margin-bottom: 40px;
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: var(--color-muted);
    }

    /* 카드 그리드 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .project-card {
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline-soft);
      border-radius: var(--radius-md);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--color-hairline);
    }

    .card-cover {
      height: 140px;
      background: var(--color-surface-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--color-hairline-soft);
    }

    .card-icon {
      font-size: 3rem;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .project-card:hover .card-icon {
      transform: scale(1.1);
    }

    .card-body {
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--color-muted);
      line-height: 1.5;
      margin-bottom: 24px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
    }

    .btn-launch {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--color-primary);
      padding: 9px 20px;
      border-radius: var(--radius-full);
      transition: background-color 0.2s ease;
    }

    .project-card:hover .btn-launch {
      background-color: var(--color-primary-active);
    }

    @media (max-width: 600px) {
      .main-container {
        padding: 32px 20px 60px;
      }
      .hero-title {
        font-size: 1.5rem;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="./" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 1c2.008 0 3.463.963 4.751 3.269l.533 1.025c1.954 3.83 6.116 12.515 7.1 14.836 1.457 3.447 1.35 6.776-.328 9.387-1.748 2.718-4.706 4.483-8.056 4.483-3.036 0-5.834-1.428-7.551-3.791-1.717 2.363-4.515 3.791-7.551 3.791-3.35 0-6.308-1.765-8.056-4.483-1.678-2.611-1.785-5.94-.328-9.387.984-2.321 5.146-11.006 7.1-14.836l.533-1.025C9.537 1.963 10.992 1 13 1h3zm0 2h-3c-1.392 0-2.392.678-3.414 2.502l-.533 1.025C7.147 10.276 3.063 18.8 2.148 20.97c-1.229 2.906-1.12 5.539.222 7.625 1.385 2.153 3.766 3.405 6.53 3.405 2.894 0 5.46-1.542 6.643-4.004l.457-.954.457.954c1.183 2.462 3.749 4.004 6.643 4.004 2.764 0 5.145-1.252 6.53-3.405 1.342-2.086 1.451-4.719.222-7.625-.915-2.17-4.999-10.694-6.905-14.443l-.533-1.025C21.392 3.678 20.392 3 19 3h-3zm0 13c3.314 0 6 2.686 6 6 0 2.585-1.636 4.8-4 5.623V25a2 2 0 0 0-4 0v2.623c-2.364-.823-4-3.038-4-5.623 0-3.314 2.686-6 6-6zm0 2c-2.209 0-4 1.791-4 4 0 1.637 1.01 3.045 2.454 3.655.334-.411.546-.937.546-1.655 0-1.657 1.343-3 3-3s3 1.343 3 3c0 .718.212 1.244.546 1.655C22.99 25.045 24 23.637 24 22c0-2.209-1.791-4-4-4z"/>
        </svg>
        <span>실습 포털</span>
      </a>

      <a href="https://github.com/kmj830/WebServerProgramming" target="_blank" rel="noopener noreferrer" class="nav-link">GitHub ↗</a>
    </div>
  </nav>

  <main class="main-container">
    <header class="hero-section">
      <h1 class="hero-title">실습 프로젝트</h1>
      <p class="hero-subtitle">실습 페이지를 선택하여 바로 실행할 수 있습니다.</p>
    </header>

    <section class="cards-grid">
      <!-- 뽀모도로 타이머 -->
      <a href="./pomodoro-timer/" class="project-card">
        <div class="card-cover">
          <span class="card-icon">🍅</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">뽀모도로 타이머</h2>
          <p class="card-desc">집중(25분) 및 휴식 사이클을 제공하는 타이머입니다.</p>
          <div class="card-footer">
            <span class="btn-launch">실행하기 →</span>
          </div>
        </div>
      </a>

      <!-- 간단한 카운터 -->
      <a href="./counter/" class="project-card">
        <div class="card-cover">
          <span class="card-icon">🔢</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">간단한 카운터</h2>
          <p class="card-desc">자바스크립트 DOM 조작 증감 카운터입니다.</p>
          <div class="card-footer">
            <span class="btn-launch">실행하기 →</span>
          </div>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
