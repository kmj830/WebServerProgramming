<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20230176 김민중 | 웹 서버 프로그래밍</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #ff385c;
      --color-primary-active: #e00b41;
      --color-ink: #222222;
      --color-body: #484848;
      --color-muted: #717171;
      --color-canvas: #ffffff;
      --color-surface-soft: #f7f7f7;
      --color-hairline: #dddddd;
      --color-hairline-soft: #ebebeb;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-full: 9999px;
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
      --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Airbnb Cereal VF', 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--color-canvas);
      color: var(--color-ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 내비게이션 */
    .top-nav {
      border-bottom: 1px solid var(--color-hairline-soft);
      background: var(--color-canvas);
    }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--color-ink);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.2px;
    }

    .brand-icon-img {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      object-fit: cover;
    }

    .nav-link {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--color-muted);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-hairline);
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      color: var(--color-ink);
      border-color: var(--color-ink);
    }

    /* 메인 컨테이너 */
    .main-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 24px 80px;
      width: 100%;
      flex: 1;
    }

    .hero-section {
      margin-bottom: 40px;
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: var(--color-muted);
    }

    /* 카드 그리드 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .project-card {
      background: var(--color-canvas);
      border: 1px solid var(--color-hairline-soft);
      border-radius: var(--radius-md);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--color-hairline);
    }

    .card-cover {
      height: 140px;
      background: var(--color-surface-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--color-hairline-soft);
    }

    .card-icon {
      font-size: 3rem;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .project-card:hover .card-icon {
      transform: scale(1.1);
    }

    .card-body {
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--color-muted);
      line-height: 1.5;
      margin-bottom: 24px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
    }

    .btn-launch {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--color-primary);
      padding: 9px 20px;
      border-radius: var(--radius-full);
      transition: background-color 0.2s ease;
    }

    .project-card:hover .btn-launch {
      background-color: var(--color-primary-active);
    }

    @media (max-width: 600px) {
      .main-container {
        padding: 32px 20px 60px;
      }
      .hero-title {
        font-size: 1.5rem;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="./" class="brand-logo">
        <img src="./favicon.png" alt="아이콘" class="brand-icon-img">
        <span>20230176 김민중</span>
      </a>

      <a href="https://github.com/kmj830/WebServerProgramming" target="_blank" rel="noopener noreferrer" class="nav-link">GitHub ↗</a>
    </div>
  </nav>

  <main class="main-container">
    <header class="hero-section">
      <h1 class="hero-title">실습 프로젝트</h1>
      <p class="hero-subtitle">실습 페이지를 선택하여 바로 실행할 수 있습니다.</p>
    </header>

    <section class="cards-grid">
      <!-- 뽀모도로 타이머 (React) -->
      <a href="./pomodoro-timer2/" class="project-card">
        <div class="card-cover">
          <span class="card-icon">⚛️</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">뽀모도로 타이머 (React)</h2>
          <p class="card-desc">React 18과 Vite로 제작된 뽀모도로 타이머입니다.</p>
          <div class="card-footer">
            <span class="btn-launch">실행하기 →</span>
          </div>
        </div>
      </a>

      <!-- 뽀모도로 타이머 (Vanilla JS) -->
      <a href="./pomodoro-timer/" class="project-card">
        <div class="card-cover">
          <span class="card-icon">🍅</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">뽀모도로 타이머 (JS)</h2>
          <p class="card-desc">바닐라 자바스크립트로 구현된 뽀모도로 타이머입니다.</p>
          <div class="card-footer">
            <span class="btn-launch">실행하기 →</span>
          </div>
        </div>
      </a>

      <!-- 간단한 카운터 -->
      <a href="./counter/" class="project-card">
        <div class="card-cover">
          <span class="card-icon">🔢</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">간단한 카운터</h2>
          <p class="card-desc">자바스크립트 DOM 조작 증감 카운터입니다.</p>
          <div class="card-footer">
            <span class="btn-launch">실행하기 →</span>
          </div>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
