<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뽀모도로 타이머</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="pomodoro">
  <a href="../" class="nav-home-btn" title="메인 포털로 돌아가기">← 목록으로</a>
  <main class="app-container">
    <header class="app-header">
      <h1 class="app-title">Pomodoro Timer</h1>
      <p class="app-subtitle">집중과 휴식의 균형으로 생산성을 높여보세요</p>
    </header>

    <!-- 모드 선택 탭 -->
    <nav class="mode-tabs" aria-label="타이머 모드">
      <button type="button" class="tab-btn active" data-mode="pomodoro">집중 (25분)</button>
      <button type="button" class="tab-btn" data-mode="shortBreak">짧은 휴식 (5분)</button>
      <button type="button" class="tab-btn" data-mode="longBreak">긴 휴식 (15분)</button>
    </nav>

    <!-- 원형 프로그레스 및 시간 표시 -->
    <section class="timer-section">
      <div class="progress-ring-wrapper">
        <svg class="progress-ring" viewBox="0 0 320 320">
          <circle class="progress-ring__bg" cx="160" cy="160" r="140" />
          <circle class="progress-ring__bar" cx="160" cy="160" r="140" />
        </svg>

        <div class="timer-content">
          <span id="status-badge" class="status-badge">집중 시간</span>
          <div id="time-display" class="time-display" aria-live="polite">25:00</div>
          <span id="session-info" class="session-info">#1 세션</span>
        </div>
      </div>
    </section>

    <!-- 컨트롤 버튼 -->
    <section class="controls-section">
      <button type="button" id="btn-start" class="btn btn-primary">시작</button>
      <button type="button" id="btn-reset" class="btn btn-secondary">초기화</button>
      <button type="button" id="btn-skip" class="btn btn-ghost" title="다음 세션으로 넘어가기">건너뛰기</button>
    </section>

    <!-- 통계 및 기록 -->
    <footer class="stats-section">
      <div class="stat-card">
        <span class="stat-label">완료한 뽀모도로</span>
        <span id="completed-count" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">사이클 진행도</span>
        <div id="cycle-dots" class="cycle-dots" aria-label="뽀모도로 사이클 4회 중 완료 개수">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </footer>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
