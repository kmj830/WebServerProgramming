<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>간단한 카운터 | Web Server Programming</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 메인으로 돌아가기 네비게이션 스타일 */
    .nav-back {
      position: absolute;
      top: 20px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #f1f3f5;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .nav-back:hover {
      background: #e9ecef;
    }
  </style>
</head>
<body>
  <a href="../" class="nav-back">← 메인 목록으로</a>

  <h1>간단한 카운터</h1>
  <div id="count">0</div>
  <div>
    <button id="dec">-</button>
    <button id="inc">+</button>
    <button id="reset">초기화</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
